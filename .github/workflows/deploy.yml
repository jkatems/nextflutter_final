name: Deploy web to GitHub Pages
# Explicit release action: nothing is published just by cloning this project.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validated-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          install-chromedriver: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze --fatal-infos --no-pub
      - run: python3 scripts/check_architecture.py
      - run: flutter test --no-pub --coverage --reporter=json > docs/quality/tests.jsonl
      - run: python3 scripts/quality_report.py
      - run: python3 scripts/check_coverage.py
      - name: Integration gate
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          "$CHROMEDRIVER" --port=4444 > /tmp/chromedriver.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4444/status && break
            sleep 1
          done
          flutter drive --no-pub --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart -d web-server --browser-name=chrome --headless --chrome-binary="$CHROME_BINARY"
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build for the configured Pages path
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: flutter build web --release --no-pub --no-web-resources-cdn --base-href="${BASE_PATH}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: validated-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
