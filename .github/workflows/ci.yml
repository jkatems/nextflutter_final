name: Flutter CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze --fatal-infos --no-pub
      - run: flutter test --no-pub --coverage
      - run: python3 scripts/check_coverage.py
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true
      - run: flutter pub get --enforce-lockfile
      - name: Start ChromeDriver
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          "$CHROMEDRIVER" --port=4444 > /tmp/chromedriver.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4444/status; then exit 0; fi
            sleep 1
          done
          cat /tmp/chromedriver.log
          exit 1
      - name: Real browser integration tests
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: >-
          flutter drive --no-pub
          --driver=test_driver/integration_test.dart
          --target=integration_test/app_test.dart
          -d web-server --browser-name=chrome --headless
          --chrome-binary="$CHROME_BINARY"
          --browser-dimension=1440x1080
          --dart-define=SCREENSHOTS=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: |
            docs/screenshots/*.png
            /tmp/chromedriver.log
  release-web:
    needs: [quality, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build web --release --no-pub --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: focusflow-web-release
          path: build/web
  android:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Compile unsigned release bundle
        run: flutter build appbundle --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: focusflow-android-unsigned
          path: build/app/outputs/bundle/release/*.aab
