name: Flutter CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: python3 scripts/check_architecture.py
      - run: flutter analyze --fatal-infos --no-pub | tee docs/quality/analyze.txt
      - run: flutter test --no-pub --coverage --reporter=json > docs/quality/tests.jsonl
      - run: python3 scripts/check_coverage.py
      - run: python3 scripts/quality_report.py
        if: success() || failure()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: |
            docs/quality/analyze.txt
            docs/quality/tests.jsonl
            docs/quality/summary.json
            docs/quality/SUMMARY.md
            docs/quality/junit.xml
            docs/quality/lcov.info
            docs/quality/coverage.html
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true
      - run: flutter pub get --enforce-lockfile
      - name: Real browser integration tests
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: ./scripts/test_web.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: |
            docs/screenshots/*.png
            docs/quality/integration-web.txt
  release-web:
    needs: [quality, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build web --release --no-pub --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: focusflow-web-release
          path: build/web
  android:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Compile unsigned release bundle
        # Flutter 3.41.x must regenerate the release plugin registry (flutter/flutter#169336).
        # --no-pub leaves integration_test registered although Gradle excludes it.
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: focusflow-android-unsigned
          path: build/app/outputs/bundle/release/*.aab
  source-submission:
    needs: [quality, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quality-evidence
          path: docs/quality
      - uses: actions/download-artifact@v4
        with:
          name: integration-evidence
          path: docs
      - run: python3 scripts/package_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: focusflow-complete-source
          path: dist/focusflow-source-*.zip
