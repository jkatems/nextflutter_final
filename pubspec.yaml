name: focus_flow
description: "FocusFlow — un espace calme pour organiser son quotidien, hors ligne."
publish_to: none
version: 1.3.0+4
environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  intl: ^0.20.2
  shared_preferences: ^2.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
  fonts:
    - family: AdwaitaSans
      fonts:
        - asset: assets/fonts/AdwaitaSans.ttf
